<!DOCTYPE html>
<html>
<head>
    <title>Logowanie Pacjenta</title>
</head>
<body>
    <h1>Logowanie Pacjenta</h1>

    {% if messages %}
        {% for message in messages %}
            <p style="color: {% if message.tags == 'error' %}red{% elif message.tags == 'success' %}green{% else %}blue{% endif %};">
                {{ message }}
            </p>
        {% endfor %}
    {% endif %}

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Zaloguj się</button>
    </form>

    <p><a href="{% url 'home' %}">Powrót do strony głównej</a></p>
</body>
</html>
