<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Wybór wizyty</title>
</head>
<body>

<h1>Wybierz opcję wizyty:</h1>

<h2>Wizyta z {{ slot.doctor.get_full_name }}</h2>
<p>Data: {{ slot.start_datetime|date:"d.m.Y" }}</p>
<p>Godzina: {{ slot.start_datetime|date:"H:i" }} - {{ slot.end_datetime|date:"H:i" }}</p>

<form method="post" action="{% url 'booking:confirm_visit' slot.id %}">
    {% csrf_token %}

    <select name="service_id" required>
        {% for service in services %}
            <option value="{{ service.id }}">
                {{ service.name }} – {{ service.price }}
            </option>
        {% endfor %}
    </select>

    <button type="submit">Potwierdź wizytę</button>
</form>

</body>
</html>
