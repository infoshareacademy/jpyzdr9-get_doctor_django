<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>

{% regroup services by doctor.specialization as specializations %}
{% for group in specializations%}
    <h2>{{ group.grouper }}</h2>
        <ul>
            {% for service in services %}
                <li>{{ service.name }} — {{ service.price }}</li>
            {% endfor %}
        </ul>
{% endfor %}
</body>
</html>
