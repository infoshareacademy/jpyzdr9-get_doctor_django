<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Rejestracja pacjenta</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/registr_patient.css' %}">
</head>
<body>
<div class="registration-header">
    <h1>Rejestracja pacjenta</h1>
</div>
<div class="registration-form-block">
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Zarejestruj</button>
    </form>
</div>
<div class="back-link">
    <a href="{% url 'visit:home_page' %}">Powrót do strony głównej</a>
</div>
</body>
</html>
