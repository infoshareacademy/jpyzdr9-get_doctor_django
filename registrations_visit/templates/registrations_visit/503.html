<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>503 - Serwis niedostępny</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f5f5f5;
            font-family: Arial, Helvetica, sans-serif;
        }

        .error-box {
            background-color: white;
            border: 3px solid #ddd;
            border-radius: 10px;
            padding: 60px 90px;
            text-align: center;
        }

        .error-code {
            font-size: 90px;
            margin: 0 0 20px;
        }

        p {
            font-size: 20px;
            color: dimgray;
            font-weight: bold;
        }

        a {
            font-size: 20px;
            color: #4ac1f7;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="error-box">
        <h1 class="error-code">503</h1>
        <p>Przepraszamy, serwis jest chwilowo niedostępny.</p>
        <p>
            Spróbuj ponownie później lub wróć na
            <a href="{% url 'visit:home_page' %}">stronę główną</a>
        </p>
    </div>
</body>
</html>
